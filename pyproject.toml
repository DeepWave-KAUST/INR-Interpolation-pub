[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "inr-interpolation"
authors = [
    {name = "Linrong Wang", email = "linrong.wang@kaust.edu.sa"},
]
description = "Seismic data interpolation using implicit neural representations with Fourier-hash features"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["seismic interpolation", "implicit neural representation", "hash encoding"]
license = {text = "BSD 3-Clause License"}
classifiers = [
        "Intended Audience :: Science/Research",
        "Natural Language :: English",
        "Programming Language :: Python :: 3.8",
        "Programming Language :: Python :: 3.9",
        "Topic :: Scientific/Engineering :: Mathematics",
    ]
# The two entry points in scripts/ run without installing this package; the pinned
# toolchain (torch 2.0.1+cu118 and the compiled tiny-cuda-nn and pyseistr) is created by
# install_env.sh, so only the pure-Python requirements are declared here.
dependencies = [
        "numpy >= 1.22.0,< 2",
        "torch >= 1.10.1",
        "matplotlib",
        "tqdm",
    ]

dynamic = ["version"]

[tool.setuptools.packages]
find = {}
